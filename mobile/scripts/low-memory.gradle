// One C++ compilation at a time, including native dependencies whose Ninja
// process otherwise ignores Gradle's --max-workers setting.
gradle.beforeProject { project ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        project.pluginManager.withPlugin(pluginId) {
            project.extensions.getByName('android').defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                '-DCMAKE_JOB_POOLS=onecpase_compile=1',
                '-DCMAKE_JOB_POOL_COMPILE=onecpase_compile',
                '-DCMAKE_JOB_POOL_LINK=onecpase_compile'
            ])
        }
    }
}
