# 1Cpace V8 — beta.1cpace.co.za
#
# Install as /etc/nginx/sites-available/beta.1cpace.co.za and symlink into
# sites-enabled. This is the plain HTTP block only: run
#
#     certbot --nginx -d beta.1cpace.co.za
#
# afterwards and certbot adds the TLS server block and the 80->443 redirect
# to this file itself. Do not hand-write those; certbot manages them.
#
# beta.1cpace.co.za already resolves to this host, which also serves
# production 1cpace.co.za. Both are matched by server_name, so production is
# untouched as long as this block names only the beta hostname.

server {
    listen 80;
    listen [::]:80;
    server_name beta.1cpace.co.za;

    # Member documents and call-list images; matches MAX_CONTENT_LENGTH (15 MB)
    # in onecpase/config.py. Leave them in step or nginx rejects the upload
    # first, with a less useful error than the app's.
    client_max_body_size 15M;

    # Beta is not for search engines.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/beta.1cpace.access.log;
    error_log  /var/log/nginx/beta.1cpace.error.log;

    location / {
        proxy_pass http://127.0.0.1:5001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A NuPay mandate status check drives a real browser through login and
        # 2FA and takes ~57s. This must stay >= gunicorn's timeout (120s) or
        # nginx returns 504 while the worker is still legitimately busy.
        proxy_connect_timeout 30s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        proxy_buffering off;
    }

    # Served by the app (Flask static), not by nginx, so that the phase gate
    # in onecpase/__init__.py still applies. Keep the cache short on beta so
    # testers are not chasing stale assets after a redeploy.
    location /static/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        expires 5m;
    }
}
