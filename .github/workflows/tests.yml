name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      ENCRYPTION_KEY: hn9GprM7ngbOnOGbcKgcZAvWg7REAcIv68-F_3VAo3I=
      PBX_WEBHOOK_SECRET: ci-test-pbx-secret
      WA_VERIFY_TOKEN: ci-test-wa-token
      FB_VERIFY_TOKEN: ci-test-fb-token
      RATELIMIT_STORAGE_URL: memory://
      RATELIMIT_TRUSTED_PROXY_COUNT: "0"
      SCHEDULER_ENABLED: "0"
      TESSERACT_CMD: "tesseract"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q onecpase
      - name: Install browser for tests and UI checks
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - name: Check desktop and mobile UI
        if: matrix.python-version == '3.12'
        run: python -m scripts.verify_ui
      - name: Upload UI evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ui-release-checks
          path: artifacts/ui-review/
