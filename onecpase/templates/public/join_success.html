<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry received</title><style>:root{--navy:#002e45;--gold:#b0842d;--bg:#0b0b10;--s1:#10111a;--b1:#252832;--txt:#f0eff6;--t2:#9b9db4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,var(--navy),var(--bg) 55%);color:var(--txt);font-family:Arial,sans-serif;padding:16px}.card{width:min(560px,100%);text-align:center;background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:48px 28px;box-shadow:0 22px 55px #0008}.tick{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#080808;font-size:2rem;font-weight:900}h1{margin:20px 0 10px}p{color:var(--t2);line-height:1.55}</style></head><body><main class="card"><div class="tick">✓</div><h1>Thank you!</h1><p>Your enquiry has been received. A {{ tenant.name }} sales consultant will contact you.</p></main></body></html>
