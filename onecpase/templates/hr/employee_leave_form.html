{% extends "base.html" %}
{% block title %}Log Leave — {{ s.first_name }} {{ s.last_name }} | 1Cpase{% endblock %}
{% block page_title %}Log Leave — {{ s.first_name }} {{ s.last_name }}{% endblock %}

{% block content %}
<div class="form-card">
  <form method="post">
    <div class="form-group">
      <label>Leave Type</label>
      <select name="leave_type">
        {% for t in leave_types %}
        <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date *</label>
        <input type="date" name="start_date" required>
      </div>
      <div class="form-group">
        <label>End Date *</label>
        <input type="date" name="end_date" required>
      </div>
    </div>
    <div class="form-group">
      <label>Reason</label>
      <textarea name="reason" rows="3"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Log Leave</button>
      <a href="{{ url_for('hr.employee_detail', sid=s.id) }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
