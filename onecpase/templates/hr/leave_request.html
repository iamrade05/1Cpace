{% extends "base.html" %}

{% block title %}Request Leave | 1Cpase{% endblock %}
{% block page_title %}Request Leave{% endblock %}

{% block content %}
<div class="form-card">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label for="leave_type">Leave Type</label>
        <select id="leave_type" name="leave_type">
          {% for t in leave_types %}
          <option value="{{ t }}" {% if request.form.get('leave_type', 'annual') == t %}selected{% endif %}>
            {{ t|capitalize }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="days">Number of Days</label>
        <input type="number" id="days" name="days" min="1"
               value="{{ request.form.get('days', '1') }}">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="start_date">Start Date *</label>
        <input type="date" id="start_date" name="start_date"
               value="{{ request.form.get('start_date', '') }}" required>
      </div>
      <div class="form-group">
        <label for="end_date">End Date *</label>
        <input type="date" id="end_date" name="end_date"
               value="{{ request.form.get('end_date', '') }}" required>
      </div>
    </div>

    <div class="form-group">
      <label for="reason">Reason</label>
      <textarea id="reason" name="reason" rows="3">{{ request.form.get('reason', '') }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Submit Request</button>
      <a href="{{ url_for('hr.leave_index') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
