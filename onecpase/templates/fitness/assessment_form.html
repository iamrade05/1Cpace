{% extends "base.html" %}
{% block title %}New Assessment | 1Cpase{% endblock %}
{% block page_title %}New Fitness Assessment{% endblock %}

{% block content %}
<div class="form-card">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label>Member *</label>
        <select name="member_id" class="member-picker" required>
          <option value="">— Choose member —</option>
          {% for m in members %}
          <option value="{{ m.id }}">{{ m.first_name }} {{ m.last_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Assessed By</label>
        <select name="assessed_by_id">
          <option value="">— None —</option>
          {% for t in trainers %}
          <option value="{{ t.id }}">{{ t.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" step="0.1" name="weight_kg">
      </div>
      <div class="form-group">
        <label>Body Fat %</label>
        <input type="number" step="0.1" name="body_fat_pct">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Muscle Mass (kg)</label>
        <input type="number" step="0.1" name="muscle_mass_kg">
      </div>
      <div class="form-group">
        <label>BMI</label>
        <input type="number" step="0.1" name="bmi">
      </div>
    </div>

    <div class="form-group">
      <label>Fitness Level</label>
      <select name="fitness_level">
        <option value="">— Select —</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea name="notes" rows="3"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Assessment</button>
      <a href="{{ url_for('fitness.assessments_index') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
