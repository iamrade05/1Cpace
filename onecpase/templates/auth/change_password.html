<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1Cpase — Change Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(circle at top left, rgba(176,132,45,0.24), transparent 24rem),
                  linear-gradient(135deg, #002e45 0%, #001f30 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border-radius: 16px;
      padding: 44px 40px; width: 100%; max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,46,69,0.34);
      border: 1px solid rgba(193,194,197,0.75);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand h1 { font-size: 2rem; font-weight: 800; color: #002e45; letter-spacing: 1px; }
    .brand p { font-size: 0.78rem; color: #9ca3af; margin-top: 4px;
               text-transform: uppercase; letter-spacing: 1.5px; }
    .step-title {
      font-size: 1.1rem; font-weight: 700; color: #002e45;
      text-align: center; margin-bottom: 6px;
    }
    .step-sub {
      font-size: 0.82rem; color: #6b7280; text-align: center;
      margin-bottom: 24px; line-height: 1.5;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.8rem; font-weight: 700;
      color: #002e45; margin-bottom: 7px;
    }
    .form-group input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #c1c2c5; border-radius: 8px;
      font-size: 0.9rem; color: #002e45;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-group input:focus {
      outline: none; border-color: #b0842d;
      box-shadow: 0 0 0 3px rgba(176,132,45,0.16);
    }
    .hint { font-size: 0.72rem; color: #9ca3af; margin-top: 4px; }
    .btn-submit {
      width: 100%; padding: 13px;
      background: #002e45; color: #fff; border: none;
      border-radius: 9px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; margin-top: 6px; transition: background .15s;
    }
    .btn-submit:hover { background: #001f30; }
    .alert-error {
      background: #fee2e2; color: #991b1b;
      border-left: 4px solid #ef4444;
      padding: 10px 14px; border-radius: 6px;
      font-size: 0.85rem; margin-bottom: 18px;
    }
    .alert-warning {
      background: #fef3c7; color: #92400e;
      border-left: 4px solid #f59e0b;
      padding: 10px 14px; border-radius: 6px;
      font-size: 0.85rem; margin-bottom: 18px;
    }
    .alert-success {
      background: #d1fae5; color: #065f46;
      border-left: 4px solid #10b981;
      padding: 10px 14px; border-radius: 6px;
      font-size: 0.85rem; margin-bottom: 18px;
    }
    .back-link {
      display: block; text-align: center; margin-top: 18px;
      font-size: 0.8rem; color: #9ca3af; text-decoration: none;
    }
    .back-link:hover { color: #b0842d; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>1Cpase</h1>
    <p>Gym Management System</p>
  </div>

  {% for category, msg in get_flashed_messages(with_categories=true) %}
  <div class="alert-{{ category }}">{{ msg }}</div>
  {% endfor %}

  <div class="step-title">Change Your Password</div>
  <div class="step-sub">
    You must set a new password before you can continue.
  </div>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="current_password">Current Password</label>
      <input type="password" id="current_password" name="current_password"
             required autocomplete="current-password" placeholder="Enter your current password">
    </div>
    <div class="form-group">
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password"
             required autocomplete="new-password" placeholder="At least 8 characters"
             minlength="8">
      <div class="hint">Minimum 8 characters.</div>
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             required autocomplete="new-password" placeholder="Repeat new password"
             minlength="8">
    </div>
    <button type="submit" class="btn-submit">Update Password</button>
  </form>

  <a href="{{ url_for('auth.logout') }}" class="back-link">← Sign out instead</a>
</div>
</body>
</html>
